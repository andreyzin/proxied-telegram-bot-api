name: "Build and Publish"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      telegram_bot_api_ref:
        description: 'Upstream tdlib/telegram-bot-api commit SHA or ref to build (empty = master)'
        required: false
        default: ''
      release_version:
        description: 'Version to publish as, e.g. v10.2. Leave empty for a nightly build (no GitHub Release, image tagged :nightly)'
        required: false
        default: ''
  workflow_call:
    inputs:
      telegram_bot_api_ref:
        description: 'Upstream tdlib/telegram-bot-api commit SHA or ref to build'
        type: string
        required: true
      release_version:
        description: 'Version to publish as, e.g. v10.2. Empty = nightly build'
        type: string
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  prepare:
    name: Resolve build parameters
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      version: ${{ steps.resolve.outputs.version }}
      is_release: ${{ steps.resolve.outputs.is_release }}
      tags: ${{ steps.resolve.outputs.tags }}
    steps:
      - name: Resolve ref/version/tags for this trigger
        id: resolve
        run: |
          # Priority: workflow_call/workflow_dispatch inputs, then a pushed vX.Y tag, then master.
          REF="${{ inputs.telegram_bot_api_ref }}"
          VERSION="${{ inputs.release_version }}"

          if [ "${{ github.ref_type }}" = "tag" ] && [ -z "$VERSION" ]; then
            VERSION="${{ github.ref_name }}"
          fi
          if [ -z "$REF" ]; then
            REF="master"
          fi

          if [ -n "$VERSION" ]; then
            IS_RELEASE=true
            TAGS="${VERSION},latest"
          else
            IS_RELEASE=false
            SHORT_REF=$(echo "$REF" | cut -c1-7)
            TAGS="nightly,nightly-${SHORT_REF}"
          fi

          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "is_release=$IS_RELEASE" >> "$GITHUB_OUTPUT"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

  build:
    name: Build platform-specific images
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: aarch64

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push by arch
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-${{ matrix.arch }}
          build-args: |
            TELEGRAM_BOT_API_REF=${{ needs.prepare.outputs.ref }}
            BUILD_VERSION=${{ needs.prepare.outputs.version || needs.prepare.outputs.ref }}

  merge:
    name: Merge manifests
    runs-on: ubuntu-latest
    needs: [prepare, build]
    permissions:
      packages: write
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Multi-Arch Manifest
        run: |
          IFS=',' read -ra TAGS <<< "${{ needs.prepare.outputs.tags }}"
          TAGS_ARGS=""
          for t in "${TAGS[@]}"; do
            TAGS_ARGS="$TAGS_ARGS --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${t}"
          done
          docker buildx imagetools create $TAGS_ARGS \
            --annotation "index:org.opencontainers.image.description=Telegram Bot API server with proxy server support" \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-amd64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-aarch64

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare, merge]
    if: needs.prepare.outputs.is_release == 'true'
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Assets (Pull, Tag, Compress)
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          VERSION="${VERSION#v}"
          docker pull --platform linux/amd64 ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-amd64
          docker pull --platform linux/arm64 ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-aarch64
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-amd64 telegram-bot-api:${VERSION}-amd64
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-aarch64 telegram-bot-api:${VERSION}-aarch64
          docker save telegram-bot-api:${VERSION}-amd64 | gzip > telegram-bot-api-${VERSION}-amd64.tar.gz
          docker save telegram-bot-api:${VERSION}-aarch64 | gzip > telegram-bot-api-${VERSION}-arm64.tar.gz

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          generate_release_notes: false
          draft: true
          prerelease: false
          files: |
            telegram-bot-api-*-amd64.tar.gz
            telegram-bot-api-*-arm64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
